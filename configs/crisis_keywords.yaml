# ══════════════════════════════════════════════════════════════
# 危机关键词配置 — 四级响应触发条件
# ══════════════════════════════════════════════════════════════
#
# 级别说明：
#   red    → 立即中断 AI 回复，全屏危机干预页面
#   orange → 引导至专业资源，强制显示热线号码
#   yellow → 注入安全引导 prompt，显示关怀提示
#   green  → 正常对话（无需配置）
#
# 匹配规则：
#   - 精确匹配（exact）：消息中包含完整词组即触发
#   - 组合匹配（combo）：同一消息中同时包含多个词才触发
#   - 上下文感知：结合最近 3 轮对话判断，避免误触发
#     （如用户讨论新闻/影视/他人经历时不应触发 red）
#
# ⚠️ 本文件修改后需重启后端服务生效
# ══════════════════════════════════════════════════════════════

red_signals:
  description: "自杀/自伤意念 — 立即触发全屏危机干预"
  # exact: 完整短语匹配，包含明确第一人称或无歧义的自杀相关表述
  exact:
    - "不想活了"
    - "我想死"
    - "我要自杀"
    - "自杀"
    - "结束生命"
    - "没有活下去的意义"
    - "活着没意思"
    - "不如死了算了"
    - "想从楼上跳下去"
    - "了结自己"
    - "割腕"
    - "吃药自杀"
    - "烧炭"
    - "上吊"
    - "跳河"
    - "跳桥"
    - "我要死了"
    - "死了就解脱了"
    - "我不想在这个世界了"
    - "活不下去"
  # ambiguous_with_first_person: 这些词本身可能出现在非自杀语境中
  # 仅当消息包含第一人称（我/自己/本人）时才触发
  first_person_only:
    - "想死"
    - "去死"
    - "不想活"
  # 近距离短语组合：两个词在 8 字符内同时出现 + 需包含第一人称（我/自己/本人）
  # 不再使用单字匹配，避免"那只猫想死"等误触发
  proximity_phrases:
    - phrase: "想去死"
      require_first_person: false
    - phrase: "不想活了"
      require_first_person: false
    - phrase: "不想再活"
      require_first_person: true
    - phrase: "了断一切"
      require_first_person: true
    - phrase: "结束自己"
      require_first_person: false
    - phrase: "没有活下去的"
      require_first_person: false
    - phrase: "活着没有意义"
      require_first_person: false
    - phrase: "不想醒来"
      require_first_person: true
    - phrase: "永远睡过去"
      require_first_person: true

orange_signals:
  description: "高风险信号 — 引导至专业资源"
  exact:
    - "自残"
    - "伤害自己"
    - "割伤自己"
    - "用刀划自己"
    - "绝望"
    - "看不到希望"
    - "活得好累不想动了"
    - "没有人关心我"
    - "没有人爱我"
    - "是多余的"
    - "这个世界不需要我"
    - "消失就好了"
    - "如果我不在了"
    - "谁会在乎呢"
    - "不配被爱"
    - "我是废物"
    - "我是垃圾"
    - "家暴"
    - "他打了我"
    - "她打了我"
    - "被暴力对待"
    - "被虐待"
    - "强迫我"
  proximity_phrases:
    - phrase: "打我打得"
      require_first_person: false
    - phrase: "受不了他打"
      require_first_person: false
    - phrase: "控制我的生活"
      require_first_person: false
    - phrase: "想伤害自己"
      require_first_person: false
    - phrase: "没有人理解我"
      require_first_person: false
    - phrase: "好想消失"
      require_first_person: false

yellow_signals:
  description: "中度困扰 — 温和提示 + 自助资源"
  exact:
    - "很焦虑"
    - "焦虑到不行"
    - "严重失眠"
    - "好几天没睡了"
    - "压力大到崩溃"
    - "情绪崩溃"
    - "控制不住哭"
    - "一直在哭"
    - "好想哭"
    - "心好痛"
    - "喘不过气"
    - "很孤独"
    - "没人可以说话"
    - "不想出门"
    - "不想见人"
    - "什么都不想做"
    - "吃不下饭"
    - "暴饮暴食"
    - "酒精依赖"
    - "一直喝酒"
    - "恐慌发作"
    - "心跳很快"

# ── 误触发排除规则 ──────────────────────────────────────────
# 当消息匹配以下模式时，降低一级处理（red→orange, orange→yellow）
false_positive_patterns:
  - "新闻里说"
  - "电影里"
  - "电视剧"
  - "小说里"
  - "听说有人"
  - "别人家"
  - "朋友说"
  - "历史上"
  - "如果假设"
  - "开玩笑"
  - "角色扮演"

# ── 用词红线（system prompt + 后处理双重拦截）──────────────
# AI 回复中绝不允许出现的词语
prohibited_words_in_response:
  clinical_terms:
    - "诊断你为"
    - "你患有"
    - "你的症状是"
    - "确诊"
    - "病历"
    - "处方"
    - "开药"
    - "用药建议"
    - "治疗方案"
    - "临床表现"
  boundary_violations:
    - "你必须"
    - "你应该马上去"
    - "你的问题很严重"
    - "你有心理疾病"
    - "你需要吃药"
    - "你是抑郁症"
    - "你是焦虑症"
    - "你有人格障碍"

# ══════════════════════════════════════════════════════════════
# Day 4 · D4.7 · 输出偏见规则（BiasDetector）
# ══════════════════════════════════════════════════════════════
# 目的：在 AI 流式输出的 flush hook 中过滤"隐性偏见/评判性语言"
# 与 prohibited_words_in_response 的区别：
#   - prohibited  聚焦"绝对禁用"（诊断、处方、"你必须"）
#   - output_bias 聚焦"偏见话术"（性别刻板、受害者归咎、道德评判等）
# 命中处理：
#   - BiasDetector.sanitize() 把 pattern 替换为 "（此处表述调整）"
#   - 记录 audit log（category + pattern + session_id）供 D5.2b 审核
# 分级：5 类 × ~12 条 ≈ 60 条规则，用于 Day 5.2b 的 20 条偏见样本回归集
# ══════════════════════════════════════════════════════════════
output_bias_patterns:
  # ── 1. 性别刻板印象（gender_stereotype） ──────────────────
  gender_stereotype:
    - "男人都"
    - "女人都"
    - "男的就是"
    - "女的就是"
    - "男人天生"
    - "女人天生"
    - "男人不会"
    - "女人不会"
    - "作为男人"
    - "作为女人"
    - "男人应该"
    - "女人应该"

  # ── 2. 关系绝对化（relationship_absolutism） ──────────────
  # 把"个例"升格为"普遍定律"的话术
  relationship_absolutism:
    - "所有人都"
    - "没人会"
    - "永远不会"
    - "肯定是"
    - "一定会"
    - "绝对不"
    - "从来没有人"
    - "任何人都"
    - "不可能有"
    - "注定失败"
    - "不可能成功"
    - "一辈子都"

  # ── 3. 受害者归咎（victim_blaming） ────────────────────────
  # 把责任全部推给询问者的话术
  victim_blaming:
    - "你活该"
    - "你也有错"
    - "都是你的问题"
    - "你自找的"
    - "怪你自己"
    - "你没资格"
    - "这是你的错"
    - "你自作自受"
    - "你先反省"
    - "你咎由自取"
    - "还不是你"
    - "你不该"

  # ── 4. 道德评判（moral_judgment） ──────────────────────────
  # 用道德标签替代情绪理解的话术
  moral_judgment:
    - "你很自私"
    - "你不配"
    - "你太矫情"
    - "你太作"
    - "你太懒"
    - "你太蠢"
    - "你不成熟"
    - "你没出息"
    - "你没道德"
    - "你真奇葩"
    - "你太差劲"
    - "你真失败"

  # ── 5. 病理化标签（pathologizing_label） ──────────────────
  # 区别于 boundary_violations（诊断级）· 这里是"轻量贴标签"
  pathologizing_label:
    - "你就是巨婴"
    - "你情商低"
    - "你有讨好型人格"
    - "你是讨好型"
    - "你太敏感"
    - "你玻璃心"
    - "你是 PUA"
    - "你被 PUA"
    - "你有回避型人格"
    - "你是 NPD"
    - "你是自恋狂"
    - "你是控制狂"

