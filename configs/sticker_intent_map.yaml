# ============================================================
# 表情包意图映射配置
# ============================================================
# 将表情包的视觉描述映射到语用功能/意图标签
# 格式：关键词 -> 意图标签
schema_version: "sticker_intent_v1"

# ========== 高置信度映射（0.9）==========
# 这些关键词几乎可以确定意图
high_confidence:
  # 赞同/附和类
  赞同:
    keywords: ["点头", "竖大拇指", "大拇指", "OK手势", "比心", "鼓掌", "拍手"]
    intent: "赞同/附和"
    confidence: 0.9
  
  # 否定/拒绝类
  否定:
    keywords: ["摇头", "摆手", "叉手", "拒绝", "不要"]
    intent: "否定/拒绝"
    confidence: 0.9
  
  # 疑惑/不解类
  疑惑:
    keywords: ["问号", "疑问", "挠头", "困惑", "不解", "黑人问号"]
    intent: "疑惑/不解"
    confidence: 0.9
  
  # 开心/高兴类
  开心:
    keywords: ["大笑", "哈哈", "开心", "高兴", "笑脸", "微笑", "嘻嘻"]
    intent: "开心/高兴"
    confidence: 0.9
  
  # 难过/伤心类
  难过:
    keywords: ["哭", "流泪", "伤心", "难过", "委屈", "哭泣", "泪流满面"]
    intent: "难过/伤心"
    confidence: 0.9
  
  # 愤怒/生气类
  愤怒:
    keywords: ["生气", "愤怒", "怒", "发火", "暴怒", "气愤"]
    intent: "愤怒/生气"
    confidence: 0.9

# ========== 中置信度映射（0.7）==========
# 这些关键词需要结合上下文判断
medium_confidence:
  # 无语/无奈类
  无语:
    keywords: ["无语", "无奈", "翻白眼", "白眼", "叹气", "扶额", "捂脸"]
    intent: "无语/无奈"
    confidence: 0.7
  
  # 撒娇/卖萌类
  撒娇:
    keywords: ["撒娇", "卖萌", "可爱", "嘟嘴", "眨眼", "wink", "比耶"]
    intent: "撒娇/卖萌"
    confidence: 0.7
  
  # 惊讶/震惊类
  惊讶:
    keywords: ["惊讶", "震惊", "吃惊", "目瞪口呆", "张大嘴", "OMG"]
    intent: "惊讶/震惊"
    confidence: 0.7
  
  # 尴尬/害羞类
  尴尬:
    keywords: ["尴尬", "害羞", "脸红", "不好意思", "羞涩"]
    intent: "尴尬/害羞"
    confidence: 0.7
  
  # 思考/沉思类
  思考:
    keywords: ["思考", "沉思", "想", "托腮", "若有所思"]
    intent: "思考/沉思"
    confidence: 0.7
  
  # 期待/渴望类
  期待:
    keywords: ["期待", "渴望", "眼巴巴", "星星眼", "发光"]
    intent: "期待/渴望"
    confidence: 0.7
  
  # 困倦/疲惫类
  困倦:
    keywords: ["困", "累", "疲惫", "打哈欠", "睡觉", "瞌睡"]
    intent: "困倦/疲惫"
    confidence: 0.7
  
  # 吃惊/害怕类
  害怕:
    keywords: ["害怕", "恐惧", "吓", "瑟瑟发抖", "颤抖"]
    intent: "害怕/恐惧"
    confidence: 0.7

# ========== 低置信度映射（0.5）==========
# 这些关键词意图不明确，需要 LLM 辅助判断
low_confidence:
  # 打招呼类
  打招呼:
    keywords: ["挥手", "招手", "你好", "嗨", "hi"]
    intent: "打招呼"
    confidence: 0.5
  
  # 告别类
  告别:
    keywords: ["再见", "拜拜", "bye", "挥手告别"]
    intent: "告别"
    confidence: 0.5
  
  # 吃东西类
  吃东西:
    keywords: ["吃", "美食", "好吃", "馋", "流口水"]
    intent: "馋/想吃"
    confidence: 0.5
  
  # 加油/鼓励类
  加油:
    keywords: ["加油", "fighting", "冲", "奥利给"]
    intent: "加油/鼓励"
    confidence: 0.5
  
  # 感谢类
  感谢:
    keywords: ["谢谢", "感谢", "鞠躬", "抱拳"]
    intent: "感谢"
    confidence: 0.5
  
  # 道歉类
  道歉:
    keywords: ["对不起", "抱歉", "sorry", "鞠躬道歉"]
    intent: "道歉"
    confidence: 0.5

# ========== OCR 文字直接映射 ==========
# 当表情包包含 OCR 文字时，优先使用文字判断意图
ocr_text_mapping:
  # 赞同类
  - patterns: ["就是就是", "对对对", "没错", "说得对", "有道理", "确实"]
    intent: "赞同/附和"
    confidence: 0.95
  
  # 否定类
  - patterns: ["不是", "不对", "不行", "不要", "拒绝"]
    intent: "否定/拒绝"
    confidence: 0.95
  
  # 疑问类
  - patterns: ["什么", "为什么", "怎么", "啥", "？"]
    intent: "疑惑/不解"
    confidence: 0.85
  
  # 开心类
  - patterns: ["哈哈", "嘻嘻", "开心", "太好了", "耶"]
    intent: "开心/高兴"
    confidence: 0.9
  
  # 难过类
  - patterns: ["呜呜", "555", "哭了", "伤心", "难过"]
    intent: "难过/伤心"
    confidence: 0.9
  
  # 无语类
  - patterns: ["无语", "服了", "醉了", "我太难了", "裂开"]
    intent: "无语/无奈"
    confidence: 0.85
  
  # 撒娇类
  - patterns: ["嘤嘤嘤", "人家", "讨厌", "哼"]
    intent: "撒娇/卖萌"
    confidence: 0.8
  
  # 感谢类
  - patterns: ["谢谢", "感谢", "多谢", "蟹蟹"]
    intent: "感谢"
    confidence: 0.9
  
  # 道歉类
  - patterns: ["对不起", "抱歉", "sorry", "不好意思"]
    intent: "道歉"
    confidence: 0.9
  
  # 加油类
  - patterns: ["加油", "冲鸭", "奥利给", "fighting"]
    intent: "加油/鼓励"
    confidence: 0.85

# ========== 兜底配置 ==========
fallback:
  # 无法匹配时的默认意图
  default_intent: "表达情绪"
  default_confidence: 0.3
  
  # 是否使用 LLM 兜底
  use_llm: true
  llm_prompt: |
    请分析以下表情包的语用功能/意图：
    
    视觉描述：{caption}
    OCR文字：{ocr_text}
    是否动画：{is_animated}
    
    请用一个简短的标签描述这个表情包的意图（如：赞同、难过、撒娇等）
    并给出置信度（0.0-1.0）
    
    输出格式：
    意图：<标签>
    置信度：<数值>
