# 两阶段 PII 检测确认人名模板
# 
# 生成方法：
#   python scripts/compression/two_stage_pii.py scan timeline_out/agent_sft_l1.jsonl
# 
# 用途：
#   - L2 云端训练数据的高精度人名匿名化
#   - 避免误检，提高匿名化准确性
# 
# 开源说明：
#   - 此为模板文件，不含真实个人信息
#   - 用户需要根据自己的数据生成确认列表
#   - 如不使用，可忽略两阶段 PII 检测功能

version: '1.0'
generated_at: 'TEMPLATE_PLACEHOLDER'
source_file: 'TEMPLATE_PLACEHOLDER'

# 确认的人名列表（由两阶段 PII 检测生成）
confirmed_names:
