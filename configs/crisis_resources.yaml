# ── 专业资源（橙色级别引导）──────────────────────────────
# 用于 orange 级别时推荐给用户的"下一步行动"
professional_guidance:
  how_to_find_therapist:
    title: "如何找到适合的心理咨询师"
    steps:
      - "确定需求：情绪困扰、关系问题、创伤修复等"
      - "选择平台：壹心理、简单心理等正规平台"
      - "查看资质：国家二级/三级心理咨询师证书"
      - "首次咨询：通常 50 分钟，约 300-800 元/次"
      - "不合适可以换：找到合拍的咨询师比坚持更重要"

  what_to_expect:
    title: "第一次咨询会发生什么"
    content: |
      · 咨询师会先了解你的基本情况和来访原因
      · 你可以说想说的，也可以沉默，没有对错
      · 所有内容严格保密（除非涉及安全风险）
      · 第一次不一定要解决问题，建立信任就很好

  online_platforms:
    - name: "壹心理"
      url: "https://www.xinli001.com"
      description: "心理咨询预约平台，可按问题类型和价格筛选"
    - name: "简单心理"
      url: "https://www.jiandanxinli.com"
      description: "专业心理咨询师预约，有低价公益咨询"
    - name: "KnowYourself"
      url: "https://www.knowyourself.cc"
      description: "心理科普 + 咨询服务"

# ── 自助资源（黄色级别提供）──────────────────────────────
# 用于 yellow 级别时在前端展示的自我调节工具
self_help_resources:
  breathing_exercises:
    title: "呼吸放松"
    icon: "wind"
    techniques:
      - name: "4-4-6 呼吸法"
        steps: "吸气 4 秒 → 屏住 4 秒 → 呼气 6 秒，重复 3-5 次"
        when: "焦虑、紧张、心跳加速时"
      - name: "腹式呼吸"
        steps: "双手放在腹部，吸气时腹部鼓起，呼气时腹部收缩，每次 5 分钟"
        when: "入睡困难、情绪激动时"

  grounding_techniques:
    title: "接地技巧"
    icon: "anchor"
    techniques:
      - name: "5-4-3-2-1 感官法"
        steps: "说出你能看到的 5 样东西、听到的 4 种声音、触摸到的 3 种质感、闻到的 2 种气味、尝到的 1 种味道"
        when: "恐慌发作、思绪失控时"
      - name: "冰块法"
        steps: "握一块冰，感受冰冷的触感，把注意力完全集中在手掌"
        when: "情绪极度波动、有自伤冲动时"

  journaling_prompts:
    title: "情绪书写"
    icon: "pen-line"
    prompts:
      - "此刻我的感受是_____，因为_____"
      - "今天让我感到温暖的一件小事是_____"
      - "如果我的情绪是一种天气，现在是_____"
      - "我现在需要的是_____"

  body_care:
    title: "身体照顾"
    icon: "heart-pulse"
    suggestions:
      - "喝一杯温水"
      - "站起来伸展身体 2 分钟"
      - "洗一个热水脸或热水澡"
      - "走出门散步 10 分钟，不需要目的地"
      - "给自己做一顿简单的饭"

  emergency_self_soothe:
    title: "紧急自我安抚"
    icon: "shield-heart"
    techniques:
      - name: "蝴蝶拥抱"
        steps: "双臂交叉放在胸前，左右交替轻拍肩膀，节奏像蝴蝶扇动翅膀"
        when: "极度悲伤或害怕时"
      - name: "安全空间想象"
        steps: "闭上眼睛，想象一个让你感到完全安全和放松的地方，用所有感官去感受那个空间"
        when: "需要从当前情境中暂时抽离时"

# ── 各级别响应时的展示模板 ──────────────────────────────────

response_templates:
  red:
    title: "你现在的感受很重要，请让专业人士帮助你"
    message: |
      我感受到你现在正经历着很大的痛苦。这种感受是真实的，你不需要独自面对。

      请现在就拨打以下热线，会有专业的人倾听你、陪伴你：

      📞 全国心理援助热线：400-161-9995（24小时）
      📞 北京危机干预热线：010-82951332（24小时）

      他们受过专业训练，你说的每一句话都会被保密和尊重。
      拨打电话不需要做任何准备，打过去就好。
    stop_ai: true
    # D2: 追加注入的安全知识条目 id（内容存 advisor_out/knowledge，由 chat.py 按 id 解析）
    knowledge_refs: ["safety_immediate_triage"]

  orange:
    title: "我注意到你正在经历一些困难"
    message: |
      你分享的这些感受让我很关心你的状态。
      有些感受可能需要专业人士的陪伴和支持，这不是软弱，而是照顾自己。

      如果你愿意，可以联系：
      📞 全国心理援助热线：400-161-9995（24小时，免费保密）

      我会继续在这里陪你，但专业的支持会让你获得更多帮助。
    stop_ai: false
    # D2: 作为 LLM 参考资料注入 system prompt（非诊断、需自然融入）
    knowledge_refs: ["safety_immediate_triage", "safety_when_to_seek_help"]

  yellow:
    title: "温馨提示"
    message: |
      我听到你正在经历一些压力和不适。照顾好自己的感受很重要。

      🌬️ 试试深呼吸：吸气 4 秒 → 屏住 4 秒 → 呼气 6 秒，重复 3 次
      🦋 或者试试蝴蝶拥抱：双臂交叉放在胸前，左右交替轻拍肩膀
      💧 先喝一杯温水，给自己几分钟

      如果这些感受持续困扰你，可以拨打 400-161-9995（24小时）和专业人士聊聊。
      我在这里，你想说什么都可以。
    stop_ai: false
    show_self_help: true
