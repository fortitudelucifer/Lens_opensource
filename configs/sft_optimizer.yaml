# SFT 数据优化配置
# 
# 优化策略：只压缩 ID 和时间戳，保留所有语义字段！
# 
# 优化前：
#   {"msg_uid": "P1:8911054651869296902", "time_local": "2025-06-07 14:54:03", "speaker": "OTHER", "msg_type": "文本", "text_raw": "..."}
# 
# 优化后：
#   {"id": 1, "time": "2025-06-07 14:54", "speaker": "OTHER", "type": "text", "text_raw": "..."}
#
# 节省来源：
#   - ID 简化：~25 字符/条（P1:8911054651869296902 → 1）
#   - 时间戳压缩：~11 字符/条（同天内 2025-06-07 14:54:03 → 14:54）
#   - 类型简化：~3 字符/条（文本 → text）

# ID 简化：P1:xxx → 1, 2, 3...
use_simple_id: true

# 时间戳压缩：同天内仅保留 HH:MM
compress_time: true

# 消息类型简化：中文 → 英文
simplify_type: true

# 保留的语义字段（不会被删除）：
# - 文本：text_raw
# - 引用：text_raw, link_quote_text
# - 表情包：sticker_summary, sticker_intent, sticker_ocr_text
# - 图片：image_summary, image_intent, image_emotion_atmosphere
# - 语音：voice_to_text, emotion_tags, emotion_desc
# - 视频：video_summary, video_voice_to_text, video_emotion_tags
# - 链接/小程序：link_title, text_raw
