product_positioning: "关系模式分析与情感支持工具"

first_use_consent:
  title: "使用须知与知情同意"
  sections:
    - heading: "产品定位声明"
      content: |
        Lens 是一款基于人工智能的关系模式分析与情感支持工具。
        本工具旨在帮助您更好地理解亲密关系中的沟通模式，提供自我探索的参考视角。

        ⚠️ 本工具不是医疗器械，不提供任何形式的心理诊断、治疗或处方建议。
        ⚠️ 如果您正在经历严重的心理困扰，请寻求持证心理咨询师或精神科医生的帮助。

    - heading: "AI 能力边界"
      content: |
        · AI 的分析基于有限的文本信息，无法替代面对面的专业评估
        · AI 可能产生不准确或不恰当的回应，请以您自身判断为准
        · AI 不了解您的完整生活背景，建议仅供参考
        · 所有建议均不构成专业心理咨询意见

    - heading: "隐私保护"
      content: |
        · 您的对话内容仅保存在本地设备，不会上传到任何服务器
        · 您可以随时删除所有对话记录
        · 我们不会将您的个人信息用于任何商业目的
        · 匿名化处理确保原始聊天记录中的真实身份信息不会泄露

    - heading: "使用承诺"
      content: |
        继续使用即表示您：
        ✓ 理解本工具的非医疗定位
        ✓ 理解 AI 分析仅供参考，不替代专业服务
        ✓ 同意在遇到紧急心理危机时拨打专业热线
        ✓ 年满 18 周岁（或已获监护人同意）

  confirm_button: "我已阅读并理解上述内容"
  decline_button: "暂不使用"

chat_disclaimer:
  text: "本 AI 仅供自我探索参考，不能替代专业心理咨询或治疗。如需紧急帮助请拨打 400-161-9995"
